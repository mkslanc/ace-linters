<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>ace-linters AMD smoke</title>
    <link rel="icon" href="data:,"/>
</head>
<body>
<div id="editor" style="height: 300px;"></div>
<script src="http://127.0.0.1:8080/vendor/ace/ace.js"></script>
<script src="http://127.0.0.1:8080/vendor/ace/ext-language_tools.js"></script>
<script>
    window.testFlags = {ready: false};
    window.__amdModules = {};
    window.define = function (deps, factory) {
        const exports = {};
        factory(exports);
        Object.assign(window.__amdModules, exports);
        Object.assign(window, exports);
    };
    window.define.amd = {};
</script>
<script src="http://127.0.0.1:8080/build/ace-linters/ace-linters.js"></script>
<script>
    window.editor = ace.edit("editor", {
        theme: "ace/theme/textmate",
        mode: "ace/mode/text",
        value: "console.log('Hello world' ;"
    });
    window.editor.setOptions({
        enableBasicAutocompletion: true,
        enableSnippets: true,
        enableLiveAutocompletion: true
    });

    window.languageProvider = LanguageProvider.fromCdn("http://127.0.0.1:8080/build/ace-linters");
    window.languageProvider.registerEditor(window.editor);
    setTimeout(() => {
        window.testFlags.ready = true;
    }, 1000);
</script>
</body>
</html>
